version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait two weeks after a release before proposing it, so a compromised or
    # broken release has time to be noticed and pulled. Security updates are not delayed.
    cooldown:
      default-days: 14
    versioning-strategy: increase
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
