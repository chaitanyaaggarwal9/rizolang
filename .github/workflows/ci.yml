name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (package.json "engines"), then current LTS and latest.
        node: ["22.12.0", "24", "26"]
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # .npmrc disables dependency install scripts; the flag makes that explicit.
      - run: npm ci --ignore-scripts
      - name: Verify npm registry signatures
        run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Compile the example with the built CLI
        run: |
          cd examples
          node ../build/src/bin.js build blog.rz
          test -s dist/schema.sql
          test -s dist/types.ts

  postgres:
    name: Generated schema loads in PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rizo
          POSTGRES_PASSWORD: rizo
          POSTGRES_DB: rizo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rizo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: rizo
      PGPASSWORD: rizo
      PGDATABASE: rizo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Compile the example
        run: cd examples && node ../build/src/bin.js build blog.rz
      - name: Apply the schema
        run: psql -v ON_ERROR_STOP=1 -f examples/dist/schema.sql
      - name: Constraints accept valid rows and reject invalid ones
        run: |
          set -u
          user=$(psql -v ON_ERROR_STOP=1 -qtAc "INSERT INTO users (email, password_hash, name) VALUES ('a@b.co', 'x', 'Ann') RETURNING id")
          expect_reject() {
            if psql -v ON_ERROR_STOP=1 -c "$1" >/dev/null 2>&1; then
              echo "::error::Expected PostgreSQL to reject: $1"
              exit 1
            fi
            echo "rejected as expected: $1"
          }
          expect_reject "INSERT INTO users (email, password_hash, name) VALUES ('A@B.co', 'x', 'Ann')"
          expect_reject "INSERT INTO users (email, password_hash, name) VALUES ('not-an-email', 'x', 'Ann')"
          expect_reject "INSERT INTO users (email, password_hash, name) VALUES ('a@b.co', 'x', 'Ann')"
          expect_reject "INSERT INTO users (email, password_hash, name) VALUES ('c@b.co', 'x', repeat('n', 101))"
          expect_reject "INSERT INTO users (email, name) VALUES ('d@b.co', 'Ann')"
          expect_reject "INSERT INTO posts (author_id, title, body, published) VALUES ('$user', '', 'b', true)"
          expect_reject "INSERT INTO posts (author_id, title, body, published, views) VALUES ('$user', 't', 'b', true, -1)"
          expect_reject "INSERT INTO posts (author_id, title, body, published) VALUES (gen_random_uuid(), 't', 'b', true)"
      - name: Type-check the generated app
        run: npx tsc -p examples/dist/tsconfig.json
      - name: End-to-end tests against PostgreSQL
        env:
          RIZO_TEST_DATABASE_URL: postgres://rizo:rizo@localhost:5432/rizo
        run: npx vitest run tests/e2e.test.ts
      - name: Apply migrations to a new database
        env:
          DATABASE_URL: postgres://rizo:rizo@localhost:5432/migrated
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE migrated"
          cd examples/dist
          node migrate.ts | tee first.log
          grep -q "applied 0001_initial.sql" first.log
          node migrate.ts | grep -q "database is up to date"
      - name: Run the generated server
        env:
          DATABASE_URL: postgres://rizo:rizo@localhost:5432/rizo
          PORT: "3999"
        run: |
          cd examples/dist
          node server.ts > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3999/api/posts > /dev/null && break; sleep 0.5; done
          test "$(curl -s http://127.0.0.1:3999/api/posts)" = '{"items":[],"next":null}'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3999/api/posts?limit=0')" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3999/api/posts -H 'Content-Type: application/json' -d '{}')" = "401"
          curl -sD headers.txt http://127.0.0.1:3999/ -o page.html
          grep -qi "content-security-policy: default-src 'none'; script-src 'self'" headers.txt
          grep -q '<script type="module" src="/_rizo/client.js">' page.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/_rizo/client.js)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:3999/admin)" = "302 http://127.0.0.1:3999/login?next=%2Fadmin"
          kill %1
          cat server.log
