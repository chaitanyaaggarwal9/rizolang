name: Bug report
description: The compiler crashed, produced wrong output or gave an unclear error.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **If this is a security problem** (for example, a password showing up in a public type, or SQL injection), do not file it here. Report it privately; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Rizo Lang version
      description: Output of `rizolang --version`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Minimal .rz file
      description: The smallest file that shows the problem.
      render: rizo
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output or error message you got.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 24.1, macOS 15"
