name: Publish to npm

# Stages the compiler on npm when a GitHub release is published.
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere, and npm
# attaches a provenance attestation proving the package was built here.
# The trusted publisher may only *stage* versions: a staged version goes live
# only after the maintainer approves it on npm with two-factor authentication.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The npm trusted publisher is bound to this environment, which only
    # accepts release tags (v*).
    environment: npm
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow's identity (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check that the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version. Bump the version first."
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - name: Verify npm registry signatures
        run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Use an npm version that supports trusted publishing
        run: npm install --global --ignore-scripts npm@11.21.2
      - name: Show what will be published
        run: npm pack --dry-run --ignore-scripts
      - name: Stage on npm (goes live only after the maintainer approves it)
        run: npm stage publish --ignore-scripts
      - name: How to approve
        run: |
          echo "::notice::rizolang@$(node -p 'require("./package.json").version') is staged on npm. Approve it at https://www.npmjs.com/package/rizolang (or: npm stage list rizolang, then npm stage approve <id>). It is not live until approved."
