name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (package.json "engines"), then current LTS and latest.
        node: ["22.12.0", "24", "26"]
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # .npmrc disables dependency install scripts; the flag makes that explicit.
      - run: npm ci --ignore-scripts
      - name: Verify npm registry signatures
        run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Compile the example with the built CLI
        run: |
          cd examples
          node ../build/bin.js build blog.rz
          test -s dist/schema.sql
          test -s dist/types.ts

  postgres:
    name: Generated schema loads in PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rizo
          POSTGRES_PASSWORD: rizo
          POSTGRES_DB: rizo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rizo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: rizo
      PGPASSWORD: rizo
      PGDATABASE: rizo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Compile the example
        run: cd examples && node ../build/bin.js build blog.rz
      - name: Apply the schema
        run: psql -v ON_ERROR_STOP=1 -f examples/dist/schema.sql
      - name: Constraints accept valid rows and reject invalid ones
        run: |
          set -u
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO users (email, password_hash, name, is_admin) VALUES ('a@b.co', 'x', 'Ann', false)"
          expect_reject() {
            if psql -v ON_ERROR_STOP=1 -c "$1" >/dev/null 2>&1; then
              echo "::error::Expected PostgreSQL to reject: $1"
              exit 1
            fi
            echo "rejected as expected: $1"
          }
          expect_reject "INSERT INTO users (email, password_hash, name, is_admin) VALUES ('A@B.co', 'x', 'Ann', false)"
          expect_reject "INSERT INTO users (email, password_hash, name, is_admin) VALUES ('not-an-email', 'x', 'Ann', false)"
          expect_reject "INSERT INTO users (email, password_hash, name, is_admin) VALUES ('a@b.co', 'x', 'Ann', false)"
          expect_reject "INSERT INTO users (email, password_hash, name, is_admin) VALUES ('c@b.co', 'x', repeat('n', 101), false)"
          expect_reject "INSERT INTO users (email, name, is_admin) VALUES ('d@b.co', 'Ann', false)"
          expect_reject "INSERT INTO blog_posts (author_id, title, body, views) VALUES (gen_random_uuid(), '', 'b', 0)"
          expect_reject "INSERT INTO blog_posts (author_id, title, body, views) VALUES (gen_random_uuid(), 't', 'b', -1)"
